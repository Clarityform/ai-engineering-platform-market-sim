version: "3.9"

services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: local
      DATABASE_URL: sqlite+aiosqlite:///./data/forgeops.db
      JWT_SECRET: ${JWT_SECRET:-LOCAL-ONLY-CHANGE-ME}
    volumes:
      - forgeops_data:/srv/app/data
    restart: unless-stopped

volumes:
  forgeops_data:
